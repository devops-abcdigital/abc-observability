name: Release

# Run by hand from the Actions tab: Release → Run workflow → branch main.
# It calls the same guarded script as a local release (`npm run release`): the NPM_TOKEN repository secret publishes
# to npmjs.com (public), and the workflow token pushes the version commit and tags and creates the GitHub Release.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (all checks + npm publish --dry-run; publishes nothing)
        type: boolean
        default: true

permissions:
  contents: write # version commit, tags, GitHub Release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Add required reviewers to this environment (Settings → Environments → release) to limit who can publish.
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: npm ci
      - run: npm run release -- ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
