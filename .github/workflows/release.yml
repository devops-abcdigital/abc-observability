name: Release

# Run by hand from the Actions tab: Release → Run workflow → branch main.
# It calls the same guarded script as a local release (`npm run release`). npm publishes through trusted publishing
# (OIDC): npmjs.com trusts this workflow, so no npm token is stored anywhere. The workflow token pushes the version
# commit and tags and creates the GitHub Release.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (all checks + npm publish --dry-run; publishes nothing)
        type: boolean
        default: true

permissions:
  contents: write # version commit, tags, GitHub Release
  id-token: write # npm trusted publishing (OIDC)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Add required reviewers to this environment (Settings → Environments → release) to limit who can publish.
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run release -- ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
