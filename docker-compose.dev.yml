# Local trace backend for testing: Grafana + Tempo + OTLP receiver in one container.
# Grafana: http://localhost:3001 (port 3000 is left free for the app under test).
services:
  otel-lgtm:
    image: grafana/otel-lgtm:0.11.10
    container_name: otel-lgtm
    ports:
      - '3001:3000'
      - '4318:4318'
