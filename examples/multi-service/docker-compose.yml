# gateway -> auth -> users, each loading the library with --import, sending traces to the shared Alloy.
# Run from the repository root, on a server where DevOps runs `alloy-shared` on the `abc_telemetry_network` network:
#   docker compose -f examples/multi-service/docker-compose.yml up -d --build
# View the traces in Grafana agf.abcdigital.io (Explore -> Tempo).
x-service: &service
  build:
    context: ../..
    dockerfile: examples/multi-service/Dockerfile
  image: abc-observability-example
  networks: [default, telemetry]

x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy-shared:4318
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=development

services:
  gateway:
    <<: *service
    command: node --import @devops-abcdigital/observability-node/register src/gateway.mjs
    ports: ['8080:8080']
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: example-gateway
      PORT: '8080'
      AUTH_URL: http://auth:8081

  auth:
    <<: *service
    command: node --import @devops-abcdigital/observability-node/register src/auth.mjs
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: example-auth
      PORT: '8081'
      USERS_URL: http://users:8082

  users:
    <<: *service
    command: node --import @devops-abcdigital/observability-node/register src/users.mjs
    ports: ['8082:8082']
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: example-users
      PORT: '8082'

networks:
  telemetry:
    external: true
    name: abc_telemetry_network
